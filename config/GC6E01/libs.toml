# fields apart), so no setting of that flag reproduces the target.  -fp_contract on (project
# default) is correct: the unit has no fmul/fadd chains to fold.
# Source: byte-identical to the pristine archive text of this member
# (.sdk-cache/musyx src/musyx/runtime/snd_service.c at 717404d, sha1
# 6033c492376f9308af41309a91afa5e89346605d); no function, literal or comment was added,
# removed or rewritten.  That includes sndBSearch's chained-assignment argument
# `if ((c = cmp(key, (ptr = (void *)((size_t)base + len * ((m = (l + r) >> 1) - 1))))) == 0)`
# and the `// This is kind of gross....` note above it (pristine line 138): both are the SDK's

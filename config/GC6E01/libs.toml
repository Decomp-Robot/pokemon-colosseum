# C_QUATSlerp at 0x800A3D3C). Its two float constants follow mtx44.o's in
# .sdata2 (0x8047C2C0 = 0.5f, 0x8047C2C4 = 3.0f). Only 10 of the 20 definitions
# occupy that range (PSVECAdd 0x800A3A78 ... VECDistance 0x800A3C00); the debug
# C_* twins and VECHalfAngle/VECReflect are never called by the game, so the
# linker dead-strips them and they are marked UNUSED in the source, as in

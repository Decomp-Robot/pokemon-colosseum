# sndRand (0x80162070, 0x1C), sndSin (0x8016208C, 0x8C), sndBSearch (0x80162118, 0xA4),
# sndConvertMs (0x801621BC, 0x10), sndConvertTicks (0x801621CC, 0x48) and sndConvert2Ms

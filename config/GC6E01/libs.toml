# order, with PopWaitingQueuePrio inlined into __DVDPopWaitingQueue (the
# out-of-line body the dolsdk2001 source declares has no bytes in the image).
# Its data is WaitingQueue in .bss 0x803FC3F8-0x803FC418 (4 entries of
# {next, prev}); nothing else of the member survives.
# Revision differences proved by the binary: the retail member restores
# interrupts before returning from the early-exit paths of
# __DVDPopWaitingQueue (0x800A7EBC calls OSRestoreInterrupts and then re-enters
# PopWaitingQueuePrio, which disables them again) and of

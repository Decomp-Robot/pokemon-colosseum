# Flag evidence (retail reverb_hi.o, versus GC/2.6 builds of this source):
#   * -fp_contract off: the retail bodies keep 1.0f - (0.05f + 0.8f*damping)
#     as separate fmuls/fadds (ReverbHIModify 0x80164B3C fmuls + 0x80164B44
#     fadds); with the default fp_contract on the product+sum folds into a
#     single fmadds and ReverbHIModify loses a word (532 -> 528 bytes). Same
#     rationale as the gx lib blocks above.
#   * no -use_lmw_stmw on: the retail prologues save GPRs via the runtime
#     helpers (ReverbHICreate 0x80164570 addi r11,r1,0x40 + bl _savegpr_20
#     for r20-r31, ReverbHICallback 0x801652EC bl _savegpr_27 for r27-r31)
#     while ReverbHIModify, which saves only r30/r31, gets individual stw's -
#     the compiler default. With the flag forced on, inline stmw/lmw were
#     emitted instead, shortening ReverbHICreate (1292 -> 1280) and
#     ReverbHICallback (224 -> 216) and shifting every downstream byte.

# which every caller inlines) are never called by the game, so the original
# link dead-stripped them; they are marked UNUSED in the source.
# Data: .data 0x80313368-0x8031358C holds three switch tables --
# jumptable_80313368 and jumptable_8031345C are the 61-entry GXTexFmt tile
# tables of GXGetTexBufferSize and __GetImageTileCount (__GXGetTexTileShift
# inlined into each), and jumptable_80313550 is the 15-entry (0x3C) format
# table of GXInitTexObj. The object also emits a fourth table for the dead

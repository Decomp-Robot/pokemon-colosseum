# stub.c is dolsdk2001's dummy link-satisfier TU: one-line bodies for 71 symbols
# that the SDK archives expect some other object to provide. The retail DOL never
# links it, so this object is registered as never-linked (completed = false); it
# has no split range in config/GC6E01/splits.txt and dtk emits no compile or link
# edge for it.
# Binary evidence (powerpc-eabi-nm on a GC/1.2.5n build of stub.c and on
# build/GC6E01/main.elf, objects listed by the build.ninja link rule):
#   * the compiled object holds 71 definitions, .text = 0x11C bytes, all `blr`;
#   * 43 of the 71 names are already defined by objects in the link: memcpy,
#     memset and __init_registers in the .init slices, main at 0x800055E0, and
#     the __div2i, __mod2i, __cvt_fp2unsigned, str/mem/printf families,
#     DSPAddTask, the MetroTRK entries and the _savefpr/_restfpr helpers in the
#     .text slice at 0x800A2B9C;
#   * 8 more are provided without any object text: _stack_addr, _stack_end,
#     __ArenaLo and __ArenaHi by build/GC6E01/ldscript.lcf, and _rom_copy_info,
#     _bss_init_info, _ctors and _dtors by the DOL's own .init/.ctors/.dtors
#     tables;
#   * the remaining 20 are not in the DOL at all: DSPAssertTask, DSPCheckInit,
#     DSPCheckMailToDSP, DSPGetDMAStatus, DSPHalt, DSPInit, DSPReset,
#     DSPSendMailToDSP, __shl2i, __shr2i, __shr2u, _start, cosf, powf, sinf,
#     tanf, rand, srand, tolower and vsprintf.
# Linking this object would therefore be a 51-way duplicate-definition error plus
# 0x11C bytes of stub text the DOL does not contain. The source is kept at the
# dolsdk2001 revision and every definition carries an "// UNUSED:" mark.
[[lib]]
name = "stub"
mw_version = "GC/1.2.5n"
cflags_preset = "base"
cflags_extra = ["-use_lmw_stmw on", "-common off", "-inline auto"]
progress_category = "sdk"
[[lib.object]]
name = "ext/dolsdk2001/stub.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc"]
completed = false

# amcstubs.a is dolsdk2001's stub implementation of the AMC/EXI2 debugger
# interface. The retail DOL links the whole AmcExi2Stubs.o object because the
# MetroTRK code calls into it, so all eight bodies are present in the binary, in
# source declaration order, at .text 0x800CE79C..0x800CE7CC:
#   0x800CE79C blr              EXI2_Init            (empty body)
#   0x800CE7A0 blr              EXI2_EnableInterrupts(empty body)
#   0x800CE7A4 li r3,0; blr     EXI2_Poll            (return 0)
#   0x800CE7AC li r3,0; blr     EXI2_ReadN           (return AMC_EXI_NO_ERROR)
#   0x800CE7B4 li r3,0; blr     EXI2_WriteN          (return AMC_EXI_NO_ERROR)
#   0x800CE7BC blr              EXI2_Reserve         (empty body)
#   0x800CE7C0 blr              EXI2_Unreserve       (empty body)
#   0x800CE7C4 li r3,1; blr     AMC_IsStub           (return 1)
# The callers are the MetroTRK slices (e.g. bl at 0x800C3EF8 EXI2_Init,
# 0x800C3C0C EXI2_EnableInterrupts, 0x800C3C34 EXI2_Poll, 0x800C3C50 EXI2_ReadN,
# 0x800C3D60 EXI2_WriteN, 0x800C3CA0 EXI2_Reserve, 0x800C3CC4 EXI2_Unreserve,
# 0x800C3864 AMC_IsStub), which is why the archive member was pulled in whole.
# Flags follow the dolsdk2001 release recipe (-O4,p -inline auto, char unsigned
# by default); the bodies contain no prologue or char access, so the
# -use_lmw_stmw/-common settings are inert here and are kept consistent with the
# os entries of the same SDK release.
[[lib]]
name = "amcstubs"
mw_version = "GC/2.6"
cflags_preset = "base"
cflags_extra = ["-use_lmw_stmw on", "-common off", "-inline auto"]
progress_category = "sdk"
[[lib.object]]
name = "ext/dolsdk2001/amcstubs/AmcExi2Stubs.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc"]
completed = true

# Nothing from support.a survives in the retail DOL: all 6 HTable.o functions,
# plus every member of the sibling List.o (DSInitList, DSInsertListObject,
# DSRemoveListObject, DSAttachList, DSNextListObj), Tree.o and string.o, are
# absent from the image. The archive is the charPipeline "structures" support
# library; the game carries its own container code instead, so the original
# link dead-stripped the whole archive and this member contributes no bytes.
# Binary evidence: no window of any compiled body (searched as reloc-masked
# byte patterns for GC/1.0 through GC/3.0a5.2 at -O2/-O3/-O4,p) occurs anywhere
# in .text; in particular DSHTableIndex's `lwz r12,8(r3)` hash-pointer dispatch
# and DSInitList's `subf rD,r4,r5` Offset computation do not exist in the DOL
# (the only 16 `subf rD,r4,r5` sites are unrelated arithmetic). The member has
# no data of its own (.text only), and charPipeline sources contain no string
# literals to look for. -use_lmw_stmw/-common are inert on a dropped object and
# are kept consistent with the os/mtx entries of the same SDK release.
# List.o was re-checked independently when its own unit was integrated: all five
# bodies were compiled with every vendored GC compiler (1.0-3.0a3.2) at
# -O0/-O1/-O2/-O3/-O4,p/-O4,s (52 objects) and no body appears verbatim in
# either DOL text segment. The claim is also layout- and codegen-independent for
# DSInitList: an instruction-level scan of the whole image finds no subf/subfc/
# neg feeding two zero-stores into another word of the same r3-based 3-word
# structure anywhere (its own compiled body is found by the same scan, so the
# scanner is validated), and DSRemoveListObject's `li r0,0; stw r0,0(rX);
# stw r0,4(rX); blr` link-clearing tail exists only once, in the unrelated
# two-word memset helper at 0x8009A2C8. mwldeppc links a member as a unit, so
# DSInitList's absence means the whole List.o member was dropped.
[[lib]]
name = "support"
mw_version = "GC/1.2.5n"
cflags_preset = "base"
cflags_extra = ["-use_lmw_stmw on", "-common off", "-inline auto"]
progress_category = "sdk"
[[lib.object]]
name = "ext/dolsdk2001/support/HTable.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc"]
completed = true
[[lib.object]]
name = "ext/dolsdk2001/support/List.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc"]
completed = true
# Tree.o was dropped by the original link too: mwldeppc never extracted the
# member from support.a because nothing in the retail image references the
# charPipeline tree API. Binary evidence: all five bodies were compiled with
# every vendored GC compiler (1.0 down to 3.0a5.2) at -O0/-O1/-O2/-O3/-O4,p/
# -O4,s (120 objects) and no body -- nor any register/offset-agnostic
# normalized form of it (register fields and branch targets masked) -- occurs
# anywhere in the DOL image, .text or data. DSInitTree is the smallest and most
# decisive witness: a 5-instruction leaf
# (`li r0,0; stw r0,4(r3); subf r0,r4,r5; stw r0,0(r3); blr`) whose signature
# matches 0 sites; the whole image contains only 16 `subf rD,r4,r5`
# instructions, and no function anywhere ends with subf/stw/blr. Tree.o has no
# data of its own (.text only) and the charPipeline sources hold no string
# literals, so there is nothing else to search for. The 5 definitions are kept
# in the source and marked UNUSED, so the object contributes no bytes -- exactly
# like HTable.o and List.o.
[[lib.object]]
name = "ext/dolsdk2001/support/Tree.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc"]
completed = true

# string.o was dropped by the original link as well: the retail image contains no
# Strcat/Strcpy/Strcmp/Strlen. Binary evidence: this member was compiled with
# every vendored GC compiler (1.0, 1.1, 1.1p1, 1.2.5, 1.2.5n, 1.3, 2.0, 2.5,
# 2.6, 2.7, 3.0a3, 3.0a3.2, 3.0a5.2) at -O0/-O1/-O2/-O3/-O4,p/-O4,s (44
# objects) and no compiled body -- nor any prefix of one ending at its final
# `blr` -- occurs anywhere in the DOL's text or data. A codegen-independent
# shape scan (per-instruction opcode + immediate, register fields, branch
# displacements and offsets masked) matches 0 sites for the 42-instruction
# Strcat, the 36-instruction Strcmp, the 20-instruction Strlen and the
# 9-instruction Strcpy; the same scanner locates linked units at their exact
# addresses (PSVECAdd at 0x800A3A78), so it is validated. The only byte-level
# hit is the 16-byte Strcat null-check prologue
# `cmplwi r5,0; bne; li r3,0; blr`, which occurs 9 times inside unrelated
# functions (e.g. 0x800CA82C, in the CodeWarrior runtime strcmp) and in data,
# and never extends past those 4 instructions. The game's string routines come
# from the CodeWarrior runtime instead (strcmp 0x800CA7FC, strcpy 0x800CA968,
# strlen 0x800CAA20), and mwldeppc extracts an archive member as a unit, so the
# absence of the four bodies means string.o was never pulled out of support.a --
# the same conclusion as its siblings HTable.o/List.o/Tree.o, whose slot at
# 0x800CF708 is followed by unrelated DVD/EXI code. The member has no data of
# its own (.text only) and the charPipeline sources hold no string literals, so
# there is nothing else to search for. The 4 definitions are kept in the source
# and marked UNUSED, so the object contributes no bytes.
[[lib.object]]
name = "ext/dolsdk2001/support/string.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc"]
completed = true

# dvdlow.o is the low-level DVD-interface member of dvd.a. The retail member is
# a shorter revision than the dolsdk2001/dolsdk2004 copies: its text is the
# contiguous 0xE00-byte block 0x800A3EB0-0x800A4CF0 that starts right after
# vec.o (PSVECAdd ends 0x800A3EB0) and ends where dvdfs.o starts. The block holds
# exactly the queue dispatcher (inlined into __DVDInterruptHandler, with the
# 0x84-byte out-of-line copy at 0x800A41D0 used as the work-around alarm), the
# timeout handler, Read, SeekTwiceBeforeRead and the 12 DVDLow* command entry
# points plus DVDLowBreak/DVDLowClearCallback/__DVDLowSetWAType, i.e. every
# definition that the game reaches. The member's other data is equally
# contiguous: .bss 0x803FC290-0x803FC360 (CommandList 0x803FC290 size 0x3C,
# AlarmForWA 0x803FC2D0, AlarmForTimeout 0x803FC2F8 size 0x28, AlarmForBreak
# 0x803FC320, Prev 0x803FC348, Curr 0x803FC354, followed by dvd.o's BB2 at
# 0x803FC360), .sdata 0x804789B8 (FirstRead = 1) and .sbss 0x8047A780-0x8047A7C8
# (StopAtNextInt..NextCommandNumber, the 18 words the member declares).
# DVDLowSetResetCoverCallback, DVDLowGetCoverStatus and __DVDLowTestAlarm have no
# bytes in the image, so the original link dead-stripped them (nothing in the
# game calls them) and they are marked UNUSED in the source; the internal
# helpers (ProcessNextCommand, AudioBufferOn, HitCache, DoJustRead,
# WaitBeforeRead, SetTimeoutAlarm, AudioBufferOn, DoBreak, SetBreakAlarm and
# AlarmHandlerForBreak) have no standalone bodies because they were inlined into
# their callers.
# dvdfs.o is the DVD filesystem member of dvd.a, from the same Sep  5 2002
# Dolphin SDK drop as dvd.o/dvdlow.o/dvdqueue.o, so it is built with the
# os-library compiler settings (GC/1.2.5n, base preset).
# Binary evidence for the split: the dvdfs.o text range is the contiguous
# 0x930-byte block 0x800A4CF0-0x800A5620 that sits between __DVDLowSetWAType
# (dvdlow.o, ends 0x800A4CF0) and DVDInit (dvd.o, starts 0x800A5624, with the
# 4-byte bss-only stub zz_800A5620_ before it). Its data is equally contiguous:
# .data 0x803118F0-0x80311A80 holds exactly the five dvdfs assert/OSReport
# strings (lbl_803118F0 "DVDConvertEntrynumToPath(possibly DVDOpen or ...",
# lbl_803119B8 "Warning: DVDOpen(): file '%s' was not found under %s.", and the
# DVDReadAsync/DVDRead/DVDSeek "specified area is out of the file" messages),
# .sdata 0x804789C0 is the member's "__FILE__" string "dvdfs.c", and .sbss
# 0x8047A7C8-0x8047A7E8 holds BootInfo/FstStart/FstStringStart/MaxEntryNum/
# currentDirectory/__DVDLongFileNameFlag/__DVDThreadQueue, which are the
# 8 words dvdfs.o declares.
# Only 12 of the definitions in dvdfs.c are reachable from the retail image
# (__DVDFSInit 0x800A4CF0, DVDConvertPathToEntrynum 0x800A4D28, DVDOpen
# 0x800A501C, DVDClose 0x800A50E4, entryToPath 0x800A5108, DVDGetCurrentDir
# 0x800A5268, DVDReadAsyncPrio 0x800A532C, cbForReadAsync 0x800A55F0,
# DVDReadPrio 0x800A541C, cbForReadSync 0x800A5534, DVDSeekAsyncPrio
# 0x800A5558, cbForSeekAsync 0x800A5568+), i.e. exactly the 0x930 bytes above.
# isSame/myStrncpy/DVDConvertEntrynumToPath have no standalone body (they were
# inlined into their only callers), and DVDFastOpen, DVDChangeDir, DVDSeekPrio,
# cbForSeekSync, DVDGetFileInfoStatus, DVDOpenDir, DVDReadDir, DVDCloseDir,
# DVDGetFSTLocation and DVDGetTransferredSize are never called by the game, so
# the original link dead-stripped them and they are marked UNUSED in the
# source. DVDPrepareStream/DVDPrepareStreamAsync/cbForPrepareStream[Async|Sync]
# do not exist in this revision of the SDK member at all: the retail image has
# no 32KB-aligned stream-prepare body and no "DVDPrepareStream" string, and the
# assert line numbers baked into the retail code (`li r5, 0x17B` for the 8.3
# panic, `0x2E6`/`0x2EC` in DVDReadAsyncPrio, `0x32C`/`0x332` in DVDReadPrio,
# `0x383` in DVDSeekAsyncPrio) are 0x10 lower in the dolsdk2001 copy, i.e. the
# retail member is a shorter revision, so those four definitions were removed
# from the source instead of being kept.
[[lib]]
name = "dvd"
mw_version = "GC/1.2.5n"
cflags_preset = "base"
cflags_extra = ["-use_lmw_stmw on", "-common off", "-inline auto"]
progress_category = "sdk"
[[lib.object]]
name = "ext/dolsdk2001/dvd/dvdlow.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc", "-i src/ext/dolsdk2001/dvd"]
completed = true
# dvdqueue.o is the DVD wait-queue member of dvd.a from the same Sep  5 2002
# Dolphin SDK drop as dvdlow.o/dvdfs.o (os-library settings: GC/1.2.5n, base
# preset). Binary evidence for the split: its text is the contiguous 0x1F8-byte
# block 0x800A7DE8-0x800A7FE0 that ends exactly where ErrorCode2Num (dvd.o)
# starts, and holds precisely __DVDClearWaitingQueue (0x38),

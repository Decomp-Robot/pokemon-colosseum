# CARDRename.o was dropped by the original link: the retail image contains
# neither CARDRename nor CARDRenameAsync. Binary evidence: CARDRenameAsync's
# distinctive calls (strlen on both names, the gameName/company disk-ID
# memcmps, __CARDCompareFileName twice, strncpy into ent->fileName) appear in
# no card body - the only card-region callers of __CARDCompareFileName,
# strncpy and strlen are CARDCreate.o's CARDCreateAsync (0x800B4774) already
# accounted for - and the card .text span is exactly tiled through
# CARDStatEx.o (ending 0x800B5C5C, where GX code begins) leaving no standalone
# body for the >=0x150-byte CARDRenameAsync or the small sync wrapper
# CARDRename (whose only calls would be CARDRenameAsync and __CARDSync; no
# such wrapper exists in the region). Nothing references either entry point,
# so the original link never pulled CARDRename.o from card.a; both stay in
# the source marked UNUSED and the link strips the member again, like
# CARDRaw.o.
[[lib.object]]
name = "ext/dolsdk2001/card/CARDRename.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc", "-i src/ext/dolsdk2001/card", "-i src/ext/dolsdk2001"]
completed = true
# CARDStat.c: UpdateIconOffsets/CARDGetStatus/CARDSetStatusAsync tile
# 0x800B5338..0x800B57D0 exactly (0x1F8+0x12C+0x174); __CARDGetStatusEx
# follows immediately at 0x800B57D0, so this revision of CARDStat.o carries
# no CARDSetStatus - nothing references it and __CARDSync was never linked.
# The drop is newer than the reference dolsdk2001 file: CARDSetStatusAsync
# validates stat->iconAddr (0xffffffff or < 0x200) and stat->commentAddr
# (0xffffffff or (addr & 0x1fff) <= 0x1fc0) before GetControlBlock, forces
# iconSpeed bits for icon 0 to FAST when the entry's iconAddr is 0xffffffff
# after UpdateIconOffsets, and __CARDAccess takes the slot's CARDControl
# (see CARDOpen.c).
[[lib.object]]
name = "ext/dolsdk2001/card/CARDStat.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc", "-i src/ext/dolsdk2001/card", "-i src/ext/dolsdk2001"]
completed = true

# CARDStatEx.o is one contiguous member in the retail link: __CARDGetStatusEx
# (0x800B57D0, 0xBC) + __CARDSetStatusExAsync (0x800B588C, 0x254) fill
# 0x800B57D0-0x800B5AE0, immediately after CARDStat.o; the member continues
# with three further live bodies (0x800B5AE0-0x800B5C5C) that the reference
# dolsdk2001 CARDStatEx.c does not define - they are called from the game's
# memcard code (bl at 0x801CDE30/0x801CE1FC/0x801CE220/0x801CF128/0x801CF344)
# and stay in the auto disassembly (zz_800B5AE0_/zz_800B5BA4_/zz_800B5BE4_),
# like IsCard for CARDMount.o - so the split ends at 0x800B5AE0. __CARDGetStatusEx
# pulled in the member: nothing in the image references __CARDSetStatusEx, and
# its only body would call __CARDSync, which has no body anywhere in the image
# (see the CARDBios.o note), so it was dead-stripped by the original link; it
# stays in the source marked UNUSED. This is a newer SDK revision than the
# reference drop: __CARDAccess takes the slot's CARDControl and every live call
# site passes (card, ent) - see the bl at 0x800B5830/0x800B590C and the
# CARDOpen.c note.
[[lib.object]]
name = "ext/dolsdk2001/card/CARDStatEx.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc", "-i src/ext/dolsdk2001/card", "-i src/ext/dolsdk2001"]
completed = true

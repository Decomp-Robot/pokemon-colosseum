# version string (0x44 bytes, followed by 4 bytes of alignment padding before
# ar.o's string at 0x80312558), .sdata 0x80478A28 is __AIVersion (the 4 bytes
# at 0x80478A2C are ar.o's 8-byte .sdata alignment padding), and .sbss
# 0x8047A8C8-0x8047A908 holds exactly the member's five callback/stack/flag
# words (0x8047A8C8-0x8047A8DC) and its five OSTime bounds
# (0x8047A8E0-0x8047A908), which is where AIInit's OSNanosecondsToTicks results
# and the handlers' sda21 accesses point. The DEBUG-only profile/__ai_src_time_*
# globals sit in .bss and, being unreferenced, are stripped by the link.

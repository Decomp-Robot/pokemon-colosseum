# folding the masks onto r0 as the 1.3-era code does.  sndBSearch is the same 0xA4 under GC/2.6
# as under 1.3.2r: its 0x30-byte frame and the _savegpr_24 (0x800C47CC) / _restgpr_24
# (0x800C4818) pair are what the retail body carries, so the prologue is not what separates the

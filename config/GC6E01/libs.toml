# MusyX reverb AUX-callback glue - the runtime.a member
# src/musyx/runtime/StdReverb/reverb_fx.c.  It supplies the reverb AUX
# callbacks that the snd library registers for high-quality reverb, occupying
# the contiguous .text run 0x8016442C-0x80164520 (SND_AUX_REASON handler
# sndAuxCallbackReverbHI 0x5C, sndAuxCallbackUpdateSettingsReverbHI 0x58,
# sndAuxCallbackPrepareReverbHI 0x40) that directly follows the
# hw_memory.c/hw_aramdma.c tail at 0x8016442C and directly precedes the
# sibling StdReverb/reverb.c member at 0x80164520 (ReverbHICreate).
# Binary evidence for the whole range being this member in source order:
#   * Compiling the pristine 2.0.0 reference text with this object's flags
#     yields .text = 0x118: sndAuxCallbackReverbHI at +0x0 (0x5C),
#     sndAuxCallbackUpdateSettingsReverbHI at +0x5C (0x58),
#     sndAuxCallbackPrepareReverbHI at +0xB4 (0x40),
#     sndAuxCallbackShutdownReverbHI at +0xF4 (0x24).  The image's
#     0x8016442C-0x80164520 (0xF4 bytes) is byte-identical to the first 0xF4
#     bytes of that object; the only relocation of the first body (bl
#     ReverbHICallback at +0x48) resolves to ReverbHICallback 0x801652DC,
#     which is exactly what the image encodes there (48000E69 at 0x80164474).
#   * The 0x8016442C body reads tempDisableFX at 0x1C4 - i.e.
#     sizeof(_SND_REVHI_WORK) in the SND_AUX_REVERBHI layout (the CheapReverb
#     sibling creverb_fx.c's sndAuxCallbackReverbSTD uses 0x13C) - and passes
#     `user` itself as the 4th argument rather than &user->rv, and calls
#     ReverbHICallback rather than ReverbSTDCallback: it is the HI source
#     text, so symbols.txt names 0x8016442C sndAuxCallbackReverbHI (the
#     inherited name sndAuxCallbackReverbSTD was the CheapReverb member's,
#     which the original link dropped).
#   * The game code registers it as the HI reverb buffer callback: at
#     0x80166FAC-0x80166FE0 it calls sndAuxCallbackPrepareReverbHI(
#     &lbl_80452500) and then sndSetAuxProcessingCallbacks(0, 0x8016442C,
#     &lbl_80452500, 0xFF, 0, 0, 0, 0xFF, 0).
# All three bodies are pure glue: they store tempDisableFX (offset 0x1C4 of
# SND_AUX_REVERBHI), load the six SND_AUX_REVERBHI tuning floats at
# 0x1C8/0x1CC/0x1D0/0x1D4/0x1D8/0x1DC in the parameter order (coloration,
# time, mix, damping, preDelay, crosstalk) and tail-call
# ReverbHIModify / ReverbHICreate.  The member emits no data or literal pool,
# so splits.txt covers .text only.
# Revision difference against the 2.0.0 reference text: the fourth definition,
# sndAuxCallbackShutdownReverbHI (0x24 bytes: stwu/mflr/bl ReverbHIFree/.../
# li r3,1/blr), is marked "// UNUSED:" because this revision predates the
# shutdown hook.  Its bytes would occupy +0xF4-+0x118 of the member, i.e.
# 0x80164520 onwards, where reverb.c's ReverbHICreate begins - the three
# boundaries 0x8016442C / 0x80164488 / 0x801644E0 / 0x80164520 are exact, and
# ReverbHIFree itself is absent from the image (nothing references it, and
# reverb.c marks that definition UNUSED too), so no caller could have pulled a

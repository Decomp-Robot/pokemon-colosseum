#     full strings scan of the DOL finds no "Failed assertion" text, no "dtk.c"
#     file-name string and no DTK-family string anywhere in the image, and the
#     image's "<< Dolphin SDK - ... >>" release banners name OS/DVD/VI/PAD/AI/
#     AR/ARQ/DSP/CARD/GX/SI/THP but no DTK.
#   * Nothing could pull the member in: symbols.txt names no DTK* symbol, no
#     source in the tree references any DTK export (dolphin.h includes dtk.h,
#     but only dtk.c itself uses it), and even the streaming entry points dtk.o
#     itself imports are absent from the image - AIRegisterStreamCallback,
#     AIResetStreamSampleCount, AISetStreamTrigger, DVDPrepareStreamAsync,
#     DVDStopStreamAtEndAsync, DVDGetStreamPlayAddrAsync and
#     DVDGetStreamErrorStatusAsync are defined nowhere in main.elf, leaving
#     only the volume trio AISetStreamVolLeft/Right and AISetStreamPlayState
#     the game's own snd code already uses (see the ax.a note; the game's
#     audio is its own MusyX-family snd library). With no reference to any DTK
#     export from linked code and no live streaming path to serve, the whole
#     member dead-strips.
# The member therefore contributes no bytes and takes the conventional
# zero-length slot at 0x800CF708 shared by the other dropped dolsdk2001
# members. All 35 definitions stay in the source as shipped by the SDK
# (byte-identical to the pristine .sdk-cache copy apart from the 35
# "// UNUSED:" lines), each marked with the single "// UNUSED:" line; the
# statics and command blocks keep their pristine form because nothing
# references them either, so the linker strips them as well. No symbols.txt
# entries are added because nothing references the DTK exports, so the linker
# strips the member again.
[[lib]]
name = "dtk"
mw_version = "GC/1.2.5n"
cflags_preset = "base"
cflags_extra = ["-use_lmw_stmw on", "-common off", "-inline auto"]
progress_category = "sdk"
[[lib.object]]
name = "ext/dolsdk2001/dtk/dtk.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc", "-i src/ext/dolsdk2001/dtk"]
completed = true

# MusyX runtime DSP microcode import: the 2.0.0-default DSP payload is byte-identical
# to the DOL at 0x8036A520-0x8036BF00; its exported length word is in .sdata.
[[lib]]
name = "runtime"
mw_version = "GC/2.6"
cflags_preset = "base"
progress_category = "sdk"
[[lib.object]]
name = "ext/musyx_sdk/runtime/dsp_import.c"
extra_cflags = ["-i src/ext/musyx_sdk/include", "-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc"]
completed = true

# DSP command-list construction and voice/studio control. This translation
# unit uses the SDK's 1.5 patch 4 version defines.
[[lib.object]]
name = "ext/musyx_sdk/runtime/hw_dspctrl.c"
extra_cflags = ["-i src/ext/musyx_sdk/include", "-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc", "-DMUSY_TARGET=MUSY_TARGET_DOLPHIN", "-DMUSY_VERSION_MAJOR=1", "-DMUSY_VERSION_MINOR=5", "-DMUSY_VERSION_PATCH=4"]
completed = true

# Core MusyX runtime hardware translation unit. It has no target-version override;
# use the runtime archive settings and its SDK/Dolphin include trees.
[[lib.object]]
name = "ext/musyx_sdk/runtime/hardware.c"
extra_cflags = ["-i src/ext/musyx_sdk/include", "-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc", "-DMUSY_VERSION_MAJOR=1", "-DMUSY_VERSION_MINOR=5", "-DMUSY_VERSION_PATCH=3"]
completed = true

# MusyX ARAM DMA implementation for the game's v1.5.3 runtime.
[[lib.object]]
name = "ext/musyx_sdk/runtime/hw_aramdma.c"
extra_cflags = ["-i src/ext/musyx_sdk/include", "-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc", "-DMUSY_VERSION_MAJOR=1", "-DMUSY_VERSION_MINOR=5", "-DMUSY_VERSION_PATCH=3"]
completed = true

# The shared vendored aramdma.h declares aramBase/aramSize only with the SDK
# versions that define them; that is a declaration-coherence fix, not a claim
# about the retail image.  At 1.5.3 no compiled translation unit reads either
# name (hw_aramdma.c keeps its ARAM base in a local), and hw_dolphin.c defines
# them only in the versions that own them - initialized for 2.0.0-2.0.1,
# uninitialized for 2.0.2 and later - so neither definition can occupy the
# game's two live sound-ID words at 0x8047B0A8/0x8047B0AC.
# MusyX v1.5.3 Dolphin audio backend: AI DMA callbacks, DSP task setup and the
# interrupt hooks that share its DMA/tick state.  Its .bss contribution is all
# 0x2060 bytes of 0x804504A0-0x80452500: a 0x50-byte DSPTaskInfo, 0x10 bytes of
# alignment padding and dram_image[4096] (0x2000 bytes).  Its .sbss contribution
# is [0x8047B080, 0x8047B0A8): the 0x28 bytes from oldState through
# userCallback, including the private DMA ring index.  0x8047B0A8/0x8047B0AC are
# the game's live sound-ID words (getters 0x801653BC/0x801653C4,
# compare/clear 0x801657F8 at 0x80165834-0x80165868, stores 0x80165AD8 and
# 0x80165C38/0x80165C44, clears 0x80165FC4/0x80165FC8), not this unit's storage.  The shared
# vendored aramdma.h version-guards its aramBase/aramSize externs to match the
# version set in which the definitions exist; that is a declaration-coherence
# fix, not a claim about the retail image.  At 1.5.3 no compiled translation
# unit reads either name (hw_aramdma.c keeps its ARAM base in a local), and this
# TU defines them only in the versions that own them - initialized for
# 2.0.0-2.0.1, uninitialized for 2.0.2 and later - so neither definition can
# occupy the game's two sound-ID words.  No linker discard is needed to keep
# the retail layout.  At the aligned candidates 0x803784E0 and
# 0x80378FF4, the word is the trailing byte of a packed opcode-0xFC pointer
# (0x80478D80) followed by opcode 0x45 and its two operands, not a pointer into
# dram_image; config.yml blocks only those two dtk false detections, leaving
# the script records' bytes and genuine fixups untouched.
[[lib.object]]
name = "ext/musyx_sdk/runtime/hw_dolphin.c"
extra_cflags = ["-i src/ext/musyx_sdk/include", "-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc", "-DMUSY_VERSION_MAJOR=1", "-DMUSY_VERSION_MINOR=5", "-DMUSY_VERSION_PATCH=3"]
completed = true

# hw_pc_output.c is the output stage of the PC renderer, the runtime.a member
# src/musyx/runtime/hw_pc_output.c, and the PC counterpart of hw_dolphin.c.  The
# game's Dolphin archive extracts nothing from it: it holds the host-facing sndPC*
# API, the PC-side salPC* helpers and the AI-less salStartAi/salExitAi/salAiGetDest
# stubs, none of which is in the image.  The three exports it shares with the
# Dolphin backend are hw_dolphin.c's AI-DMA bodies rather than this member's PC
# stubs, the two call sites that would pull in salPCChannels/salPCMixRate
# (hw_volconv.c, synth_vsamples.c) sit inside `#if MUSY_TARGET == MUSY_TARGET_PC`,
# and the rest is reached only from hw_pc.c, which the archive does not contain;
# the member's large .bss/.data statics are absent as well.  So, as for
# hw_pc_null.c, the translation unit keeps the reference includes and one
# "// UNUSED:" marker per removed definition, emits no bytes and takes the
# zero-length .text slot shared by the dropped members.  MUSY_TARGET_DOLPHIN states
# the archive target explicitly as on the sibling PC member, and MUSY_VERSION
# follows the game's v1.5.3 runtime like hardware.c/hw_aramdma.c/hw_dolphin.c; both
# are unobservable because nothing in the unit is compiled for this target.
[[lib.object]]
name = "ext/musyx_sdk/runtime/hw_pc_output.c"
extra_cflags = ["-i src/ext/musyx_sdk/include", "-i src/ext/musyx_sdk/runtime", "-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc", "-DMUSY_TARGET=MUSY_TARGET_DOLPHIN", "-DMUSY_VERSION_MAJOR=1", "-DMUSY_VERSION_MINOR=5", "-DMUSY_VERSION_PATCH=3"]
completed = true

# hw_pc_null.c is a runtime.a member in the reference SDK, but the game's
# archive extracts nothing from it.  Upstream it is the PC host device backend
# that CMakeLists.txt adds in the `else` branch of `if (MUSYX_ENABLE_SDL)`
# (the SDL variant hw_pc_sdl.c is the alternative), and it defines the six
# interrupt hooks plus four PC device hooks sndPCStartAudio/sndPCOpenAudio/
# sndPCStopAudio/sndPCPauseAudio.  None of those ten definitions comes from
# this member in the DOL:
#   * The six interrupt hooks at 0x801642F8-0x801643D8 (hwInitIrq 0x2C,
#     hwExitIrq 0x4, hwEnableIrq 0x38, hwDisableIrq 0x38, hwIRQEnterCritical
#     0x20, hwIRQLeaveCritical 0x20) are hw_dolphin.c's bodies over
#     hwIrqLevel/OSDisableInterrupts/OSRestoreInterrupts, and that member's
#     .text is 0x4F8 bytes, byte-identical to the DOL span 0x80163EE0-
#     0x801643D8 outside its relocation sites, i.e. exactly the span these
#     symbols occupy; the null stubs here would instead be tail calls into
#     salPCExternalEnter/salPCExternalLeave, which the image lacks.
#   * No sndPC*/salPC* symbol appears in symbols.txt and no such string exists
#     in the DOL, because their only callers belong to the PC-only renderer
#     (hw_pc.c and friends), which the Dolphin archive does not contain.
# Nothing of this member is in the image, so the translation unit keeps only the
# reference includes and a marker per removed definition, compiles to an empty
# object and gets a zero-length .text split, the representation this project
# uses for members that emit no bytes (e.g. ext/dolsdk2001/base/PPCPm.c).
[[lib.object]]
name = "ext/musyx_sdk/runtime/hw_pc_null.c"
extra_cflags = ["-i src/ext/musyx_sdk/include", "-i src/ext/musyx_sdk/runtime", "-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc", "-DMUSY_TARGET=MUSY_TARGET_DOLPHIN", "-DMUSY_VERSION_MAJOR=1", "-DMUSY_VERSION_MINOR=5", "-DMUSY_VERSION_PATCH=4"]
completed = true

# hw_pc_rate.c is the sampling-rate adapter of the PC renderer, the runtime.a
# member src/musyx/runtime/hw_pc_rate.c.  It defines exactly two functions,
# salPCConvertStudioCycle and salPCConvertCycle, and emits no data.  The game's
# Dolphin archive extracts nothing from it:
#   * The two definitions have no caller outside hw_pc.c (salPCConvertStudioCycle
#     at hw_pc.c:574, salPCConvertCycle at hw_pc.c:612 and hw_pc.c:624), the PC
#     renderer that the Dolphin archive does not contain at all -- the image
#     holds none of its sndPC*/salPC* API, no sndPCRender/salPCB* body and no PC
#     renderer state.
#   * The member cannot be part of a Dolphin link in the first place: its 64-bit
#     phase arithmetic is spelled s64/u64, which musyx.h declares only in its
#     MUSY_TARGET_PC arm (the reference build selects that arm on the command
#     line: CMakeLists.txt sets MUSY_TARGET to MUSY_TARGET_PC).  Compiling the
#     reference text with the object's Dolphin settings fails on the first s64
#     declaration ("undefined identifier 's64'").
#   * No salPC*/sndPC* string exists anywhere in the DOL, and the polyphase
#     coefficients salPCRateCoefficients returns are hw_pc.c's zero-initialised
#     .bss table (built at run time by initResampleTables), so this member emits
#     no data that could be found in the image either.  The archive's Dolphin
#     text range around it is fully claimed as well: hw_aramdma.c ends at
#     0x80163EE0, hw_dolphin.c (salCallback 0x80163EE0, dspInitCallback
#     0x80163F88, dspResumeCallback 0x80163F98, salInitAi 0x80163FFC ...
#     hwIRQLeaveCritical 0x801643B8+0x20) fills 0x80163EE0-0x801643D8, and
#     hw_memory.c starts at 0x801643D8.
# So, as for hw_pc_null.c and hw_pc_output.c, the translation unit keeps the
# reference include and one "// UNUSED:" marker per removed definition, compiles
# to an empty object and takes the zero-length .text slot shared by the dropped
# members.  MUSY_TARGET_DOLPHIN states the archive target explicitly as on the
# sibling PC members, and MUSY_VERSION follows the game's v1.5.3 runtime like
# hardware.c/hw_aramdma.c/hw_dolphin.c; both are unobservable because nothing in
# the unit is compiled for this target.
[[lib.object]]
name = "ext/musyx_sdk/runtime/hw_pc_rate.c"
extra_cflags = ["-i src/ext/musyx_sdk/include", "-i src/ext/musyx_sdk/runtime", "-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc", "-DMUSY_TARGET=MUSY_TARGET_DOLPHIN", "-DMUSY_VERSION_MAJOR=1", "-DMUSY_VERSION_MINOR=5", "-DMUSY_VERSION_PATCH=3"]
completed = true

# hw_pc_vsample.c is the PC implementation of the two virtual-sample buffer
# entry points, the runtime.a member src/musyx/runtime/hw_pc_vsample.c that
# CMakeLists.txt:53 lists between hw_pc_rate.c (52) and hw_pc_song.c (54) among
# the PC renderer members.  It defines sndVirtualSampleAllocateBuffers and
# sndVirtualSampleFreeBuffers, the pair the shared reference source splits by
# target: pristine synth_vsamples.c:316-370 keeps its own copies under
# `#if MUSY_TARGET != MUSY_TARGET_PC`, so exactly one of the two members defines
# the pair for a given target.  The game's v1.5.3 Dolphin runtime.a extracts
# nothing from this member:
#   * The linked virtual-sample code is synth_vsamples.c's Dolphin arm --
#     vsInit 0x80159494, vsSampleStartNotify 0x80159550, vsSampleEndNotify
#     0x80159798, vsUpdateBuffer 0x80159840, vsSampleUpdates 0x80159A38, one
#     contiguous 0x7B4-byte run -- and even that arm's two buffer entry points
#     are dropped at link because nothing calls them: symbols.txt names neither.
#   * A whole-image `bl` scan (owners from symbols.txt) finds
#     aramAllocateStreamBuffer 0x80163CA8 called only from hwInitStream
#     (0x80162F54), sndStreamAllocLength 0x8014F298 only from sndStreamAllocEx
#     (0x8014F0B4) and aramFreeStreamBuffer 0x80163DE8 only from hwExitStream
#     (0x80162F74) -- the allocate path has to call the first two and rolls the
#     third back on a short allocation count -- while hwOff 0x80162D18 is called
#     only from synthDeactivateStudio (0x8014DD20) and voiceKill 0x8015863C only
#     from mcmdSetKeyGroup, synthHWMessageHandler, voiceKillSound and
#     vsSampleUpdates, where this member's free path pairs voiceKill with hwOff
#     inside its buffer loop.
#   * The member holds no storage of its own -- its state is the shared `vs`
#     object, whose .bss block at 0x80446F10 is synth_vsamples.c's -- and no
#     salPC*/sndVirtualSample string exists anywhere in the DOL.
#   * Textually it is a host-toolchain member: the archive's C89 -lang=c
#     settings reject it.  In that language mode musyx.h:44-50 takes its
#     `#if __STDC_VERSION__ <= 199901L` arm (45-46) and only typedefs bool to
#     unsigned long, the <stdbool.h> include (48) being the C11-and-later arm,
#     so `false` at lines 9/16/20 and UINT32_MAX at line 15 are undefined
#     identifiers while the mid-block declarations at lines 22-23 and the
#     for-init declaration at line 50 are C89 syntax errors; compiling the
#     pristine file with this object's exact command line reproduces them.  MUSY_TARGET_PC
#     together with C11 is what makes the reference CMakeLists.txt accept the
#     body.
# So, as for hw_pc_null.c/hw_pc_output.c/hw_pc_rate.c/hw_pc_song.c/
# hw_pc_samples.c/hw_pc_sdl.c, the translation unit keeps the reference includes
# and one "// UNUSED:" marker per removed definition and defines nothing, so it
# compiles to no .text and takes the zero-length .text slot at 0x801643D8 shared
# by the dropped PC members.  The object's only emitted section is the 0x20-byte
# .sdata2 holding the weak `_half$localstatic3$sqrtf$Ff`/
# `_three$localstatic4$sqrtf$Ff` (and `sqrt`) doubles contributed by <math.h>'s
# extern inline sqrtf/sqrt (src/ext/dolsdk2001/include/libc/math.h:30-68, pulled
# in by musyx.h:7); nothing in the unit uses them, nothing references them, mwld
# drops them and the image is unaffected (the same artifact exists in the
# sibling PC units).  MUSY_TARGET_DOLPHIN states the archive target explicitly
# as on those siblings and MUSY_VERSION follows the game's v1.5.3 runtime like
# hardware.c/hw_aramdma.c/hw_dolphin.c; both are unobservable here because
# nothing in the unit is compiled for this target.
[[lib.object]]
name = "ext/musyx_sdk/runtime/hw_pc_vsample.c"
extra_cflags = ["-i src/ext/musyx_sdk/include", "-i src/ext/musyx_sdk/runtime", "-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc", "-DMUSY_TARGET=MUSY_TARGET_DOLPHIN", "-DMUSY_VERSION_MAJOR=1", "-DMUSY_VERSION_MINOR=5", "-DMUSY_VERSION_PATCH=3"]
completed = true

# hw_pc_song.c is the host song cache of the PC renderer, the runtime.a member
# src/musyx/runtime/hw_pc_song.c (CMakeLists.txt:54, between hw_pc_vsample.c and
# hw_pc_samples.c).  It defines exactly salPCAcquireSong, salPCReleaseSong and
# salPCCollectSongs over the file-static `songs` list plus the file-static PCSong
# type.  The game's v1.5.3 Dolphin archive extracts nothing from it:
#   * Every call site of the three exports is an arm of `#if MUSY_TARGET ==
#     MUSY_TARGET_PC` with no `#else`/`#elif` ahead of the call, so the Dolphin
#     build compiles all of them out: salPCAcquireSong -- seq.c:409 (arm 408-412)
#     and seq.c:937 (arm 932-945); salPCReleaseSong -- eight sites, all in seq.c:
#     :728 and :729 (arm 727-733), :746 (arm 745-749), :896 (arm 895-899), :943
#     (arm 932-945), :1336 (arm 1335-1338), :1583 and :1584 (arm 1582-1588); and
#     salPCCollectSongs -- s_data.c:561 (arm 338-681, `#else` at :567),
#     s_data.c:940 (arm 936-943, `#else` at :944), snd_init.c:207 (arm 196-208),
#     seq_api.c:49 (arm 48-50) and seq_api.c:139 (arm 138-140).  With no
#     undefined reference left, the link never pulls the member in, so it emits
#     neither code nor data, and none of the three names is in symbols.txt.
#   * salPCAcquireSong's decoder, salPCDecodeArrangement (hw_pc_assets.c:594),
#     belongs to the PC asset/decoder pair hw_pc_assets.c/hw_pc_decode.c, which
#     the image does not contain either.  The member's remaining externals are
#     the allocator pair -- the reference's salMalloc/salFree, which this v1.5.3
#     revision exports as salAlloc (0x801643D8) and salFree (0x80164400) from
#     hw_memory.c.  That pair is linked, but a whole-image `bl` scan finds it
#     called only from the Dolphin side (salAlloc from synthInit, salInitDspCtrl,
#     aramInit, salInitAi and ReverbHICreate; salFree from synthExit,
#     salExitDspCtrl, aramInit, salExitAi and ReverbHIModify), never from a body
#     that allocates or frees a decoded song buffer.
# So, as for hw_pc_null.c/hw_pc_output.c/hw_pc_rate.c/hw_pc_samples.c/
# hw_pc_sdl.c, the translation unit keeps the reference includes and one
# "// UNUSED:" marker per removed definition, compiles to an empty object and
# takes the zero-length .text slot at 0x801643D8 shared by the dropped PC
# members.  MUSY_TARGET_DOLPHIN states the archive target explicitly as on those
# siblings and MUSY_VERSION follows the game's v1.5.3 runtime like
# hardware.c/hw_aramdma.c/hw_dolphin.c; both are unobservable because nothing in
# the unit is compiled for this target.
[[lib.object]]
name = "ext/musyx_sdk/runtime/hw_pc_song.c"
extra_cflags = ["-i src/ext/musyx_sdk/include", "-i src/ext/musyx_sdk/runtime", "-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc", "-DMUSY_TARGET=MUSY_TARGET_DOLPHIN", "-DMUSY_VERSION_MAJOR=1", "-DMUSY_VERSION_MINOR=5", "-DMUSY_VERSION_PATCH=3"]
completed = true

# hw_pc_samples.c is the PC sample registry of the reference tree, the runtime.a
# member src/musyx/runtime/hw_pc_samples.c.  The game's v1.5.3 Dolphin archive
# extracts nothing from it, because the same registry lives in synthdata.c for
# every non-PC target:
#   * The pristine reference synthdata.c guards its own sample-directory code
#     with `#if MUSY_TARGET != MUSY_TARGET_PC` (synthdata.c:246-506) and defines
#     dataInsertSDir, dataRemoveSDir, dataAddSampleReference,
#     dataRemoveSampleReference and dataGetSample there; this member is the PC
#     replacement for exactly those five definitions and adds the two host
#     helpers salPCResetSampleData/salPCFinishSampleUpload, whose only callers
#     are the PC arms (`#if MUSY_TARGET == MUSY_TARGET_PC` in synthdata.c's
#     dataInit, and s_data.c).  Compiling the pristine text for this target and
#     linking it would therefore produce duplicate definitions of all five
#     data* entry points.
#   * The four data* entry points that do exist in the image are synthdata.c's
#     bodies, not this member's copies: dataInsertSDir 0x80151770 (0x188),
#     dataAddSampleReference 0x801518F8 (0xD8), dataRemoveSampleReference
#     0x801519D0 (0x98) and dataGetSample 0x801521B8 (0x128) all sit inside
#     synthdata.c's split range.  dataGetSample walks the 128-entry SDIR_TAB
#     table dataSmpSDirs (0x8043CCF8) counted by dataSmpSDirNum (0x8047AFAA)
#     and searches it with the smpcmp comparator at 0x801521A8; dataInsertSDir
#     brackets the same table with hwDisableIrq (0x80164360) / hwEnableIrq
#     (0x80164328) and runs the per-entry duplicate-id scan.  This member has
#     none of that state: it keeps its own `static SDIR_TAB directories[128]`,
#     `directoryCount` and `uploading` plus a hand-rolled binary search, and
#     compiles (sizes from the archive's GC/2.6 settings -O4,p -inline auto on a
#     C89 spelling of the same text) to dataInsertSDir 0xE8,
#     dataAddSampleReference 0x214, dataRemoveSampleReference 0x138 and
#     dataGetSample 0x19C, none of which matches the image's bodies.
#   * hwSaveSample 0x80163050 / hwRemoveSample 0x80163104, the only external
#     hooks the member calls, are hardware.c's definitions and are reached in
#     the image from synthdata.c:427/463/490 (its non-PC arm), not from here.
#   * salPCResetSampleData/salPCFinishSampleUpload have no definition, caller or
#     address anywhere in the DOL (symbols.txt names no salPC* symbol; the pair
#     exists only under the PC arms that the Dolphin build compiles out).
#   * The text itself is a PC-toolchain member, not a CodeWarrior one:
#     CMakeLists.txt builds the runtime with MUSY_TARGET_PC and C11, and the
#     pristine file uses C99 for-init declarations (hw_pc_samples.c:44) and
#     mid-block declarations plus a compound-literal SDIR_TAB assignment in
#     dataInsertSDir, so it does not compile under the archive's C89 -lang=c
#     settings at all.
# Nothing of this member is in the image, so the translation unit keeps the
# reference includes and one "// UNUSED:" marker per removed definition,
# compiles to an empty object and takes the zero-length .text slot shared by
# the dropped PC members (0x801643D8, right after hw_pc_rate.c and before
# hw_memory.c), the representation used for members that emit no bytes (see
# hw_pc_null.c/hw_pc_output.c/hw_pc_rate.c).  MUSY_TARGET_DOLPHIN states the
# archive target explicitly as on the sibling PC members, and MUSY_VERSION
# follows the game's v1.5.3 runtime like hardware.c/hw_aramdma.c/hw_dolphin.c;
# both are unobservable because nothing in the unit is compiled for this target.
[[lib.object]]
name = "ext/musyx_sdk/runtime/hw_pc_samples.c"
extra_cflags = ["-i src/ext/musyx_sdk/include", "-i src/ext/musyx_sdk/runtime", "-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc", "-DMUSY_TARGET=MUSY_TARGET_DOLPHIN", "-DMUSY_VERSION_MAJOR=1", "-DMUSY_VERSION_MINOR=5", "-DMUSY_VERSION_PATCH=3"]
completed = true

# hw_pc_sdl.c is the optional SDL3 device adapter of the PC build: in
# CMakeLists.txt it is added under `if (MUSYX_ENABLE_SDL)` and hw_pc_null.c is
# the `else` branch, so the two are mutually exclusive members of a build whose
# MUSY_TARGET is MUSY_TARGET_PC.  The game's v1.5.3 Dolphin runtime.a extracts
# nothing from it and the image holds none of its bytes:
#   * The member opens an SDL audio device (SDL_InitSubSystem,
#     SDL_OpenAudioDeviceStream, SDL_SetAudioStreamFormat), renders on an
#     SDL_CreateThread worker named "MusyX Audio" and serialises through SDL
#     mutexes.  Neither the musyx nor the dolsdk2001 include tree carries an SDL
#     header (its <SDL3/SDL.h> cannot resolve in this build at all) and the DOL
#     contains no SDL string and no "MusyX Audio" thread name.

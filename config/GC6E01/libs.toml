# fstload.o is the FST-bootstrap member of dvd.a from the same Sep  5 2002
# Dolphin SDK drop as dvdlow.o/dvdfs.o/dvdqueue.o (os-library settings:
# GC/1.2.5n, base preset). Binary evidence for the split: cb (0x800A839C,
# 0xD8 bytes) and __fstLoad (0x800A8474, 0x168 bytes) form the contiguous
# 0x240-byte block 0x800A839C-0x800A85DC that ends exactly where the VI
# function zz_800A85DC_ starts; the code before it belongs to dvd.o.
# Its data is equally contiguous and self-contained: .data
# 0x80312078-0x803120E8 holds exactly the five __fstLoad OSReport format
# strings ("  Game Name ... %c%c%c%c\n" at 0x80312078, then the Company /
# Disk # / Game ver / Streaming lines up to 0x803120E8, where vi.c's
# "<< Dolphin SDK - VI ..." string begins), .sdata 0x804789E8 is fstload.o's
# string pool ("\n" 0x804789E8, "OFF" 0x804789EC, "ON" 0x804789F0, padded to
# the 8-aligned 0x804789F8 where vi.c's .sdata resumes), .bss

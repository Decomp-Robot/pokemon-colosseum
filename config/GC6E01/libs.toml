#    _three$localstatic4$sqrt(f)__Ff, the same artifact snd_math.c documents); they are dropped
#    at link and the retail .sdata2 runs straight from snd_math.c's block ending at 0x8047D4D4
#    to hardware.c's block at 0x8047D4D8 through 4 bytes of inter-object padding.
# inpTranslateExCtrl (0x80161D20, 0x70) sits inside the same run even though the detected
# function inventory does not list it: it is live code of this member, inpAddCtrl calls it
# out-of-line (the member's only REL24 reference to it, at member offset 0xBC8 = 0x80160F64), inpGetExCtrl

# ai.o is the AI-interface member of ai.a from the same Sep  5 2002 Dolphin SDK
# drop as ar/arq/dsp (the retail version string at 0x80312510 reads
# "<< Dolphin SDK - AI\trelease build: Sep  5 2002 05:34:25 (0x2301) >>"), so it
# is built with the os-library compiler settings.
# Binary evidence for the split: the member's text is the contiguous
# 0x800AC02C-0x800AC910 block that starts right where __PADDisableRecalibration
# ends and ends where ar.o's ARGetSize begins; the 19 functions whose bodies
# occupy it are, in source order, AIRegisterDMACallback 0x800AC02C,
# AIInitDMA 0x800AC070, AIStartDMA 0x800AC0F8, AIStopDMA 0x800AC110,
# AISetStreamPlayState 0x800AC128, AIGetStreamPlayState 0x800AC200,
# AISetDSPSampleRate 0x800AC210, AIGetDSPSampleRate 0x800AC2F0,
# __AI_set_stream_sample_rate 0x800AC304, AIGetStreamSampleRate 0x800AC3D8,
# AISetStreamVolLeft 0x800AC3E8, AIGetStreamVolLeft 0x800AC404,
# AISetStreamVolRight 0x800AC414, AIGetStreamVolRight 0x800AC430,
# AIInit 0x800AC440, __AISHandler 0x800AC5AC, __AIDHandler 0x800AC628,
# __AICallbackStackSwitch 0x800AC6D4 and __AI_SRC_INIT 0x800AC72C.

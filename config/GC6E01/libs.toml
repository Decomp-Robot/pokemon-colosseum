# straight away. __DVDIsBlockInWaitingQueue has no bytes in the image (the
# 0x1F8-byte block is fully accounted for by the five functions above and no
# call site references it), so the link dead-stripped it and it is marked
# UNUSED in the source. DVDDumpWaitingQueue (and with it the static
# CommandNames table it is the only user of) is likewise absent: the image has
# no such body and none of its strings ("==== DVD Waiting Queue Status ====",
# "CHANGE_DISK", "BS_CHANGE_DISK", ... appear nowhere in the DOL and there is
# no "dvdqueue.c" __FILE__ string), so it was removed from the source instead
# of being kept.
[[lib.object]]
name = "ext/dolsdk2001/dvd/dvdfs.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc", "-i src/ext/dolsdk2001/dvd"]

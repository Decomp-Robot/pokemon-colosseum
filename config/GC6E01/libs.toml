#    format: at 0x800BAA78-0x800BAA94 the retail body subtracts 8 from the
#    format and range-tests it against 2 (addi/cmplwi), storing 0xA0 for
#    GX_TF_C4/C8/C14X2 and 0xC0 otherwise, while the reference always stores
#    0xC0. Written as (u32)(format - GX_TF_C4) <= (GX_TF_C14X2 - GX_TF_C4).
#  * __GXSetSUTexRegs' per-stage loop adds one more gate before calling
#    __SetSURegs: after the tcsManEnab test it loads gx+0x4E0 and tests bit i

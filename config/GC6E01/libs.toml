# G2D.o (G2D.a) was dropped by the original link: nothing in the retail image
# references the G2D sprite/layer API, so mwldeppc never extracted the member.
# Binary evidence: the DOL contains no "g2d" string, no G2D name appears in
# symbols.txt/splits.txt, and none of the 7 definitions in the source survives
# in the image. The source was compiled with the project flags (-O4,p,
# -inline auto) under GC/2.6 and GC/1.2.5n; the exact register+mnemonic
# sequence of every body occurs 0 times in the 4,671,418-instruction retail
# .text, a 24-instruction mnemonic-window index over the same text returns 0
# windows, and the longest common mnemonic run is 4 instructions for the
# smallest body (G2DInitSprite, 0x140 bytes) and 7 for the largest
# (G2DDrawLayer, 6760 bytes) -- no signal at all. The two large bodies are also
# excluded by their call graph: G2DDrawLayer issues GXBegin 3x,
# GXSetChanMatColor/GXSetArray 1x each and GXSetTevOp/GXSetTevOrder, but the
# only function in the whole image that calls both GXSetTevOp and
# GXSetChanMatColor is __GXInitGX (0x800B671C, 0 GXBegin calls), and the only
# game function combining GXSetChanMatColor+GXSetArray+GXBegin is
# zz_8016AB94_ (0x8016AB94, 3716 bytes) which never calls GXSetTevOp;
# G2DSetCamera calls MTXLookAt immediately followed by GXLoadPosMtxImm, yet
# MTXLookAt's 4 call sites (0x800E0224 inside the 0x20-byte forwarder
# zz_800E0218_, 0x8019505C and 0x80195728 followed by MTXMultVecSR, and
# 0x80196064 followed by a lwz/cmplwi/rlwinm bit-clear) contain no
# GXLoadPosMtxImm; G2DInitWorld brackets MTXOrtho between
# GXSetZMode(0,GX_ALWAYS,1) and GXSetProjection(GX_ORTHOGRAPHIC) and none of
# MTXOrtho's 6 call sites has that bracket; G2DSetViewport's distinctive
# 8-instruction body (four clrlwi + sh/sthu pairs then `bl GXSetScissor`)
# matches 0 sites of any length. The member's only data (glob, 0x28 bytes in
# .bss, and the float constants in .sdata2, 0x70 bytes) is read solely by those
# stripped bodies, so it goes with them. The 6 external definitions are kept in
# the source and marked UNUSED, leaving the file-static inline helper
# FillSection (inlined into G2DDrawLayer, no standalone body in the image)
# untouched; the object contributes no bytes and takes the conventional
# zero-length slot at 0x800CF708 shared by the other dropped members. The
# library settings mirror the sibling dolsdk2001 archives (gx.a, support.a);
# the compiler choice is checksum-neutral here because no byte of G2D.o links.
[[lib]]
name = "G2D"
mw_version = "GC/1.2.5n"
cflags_preset = "base"
cflags_extra = ["-use_lmw_stmw on", "-common off", "-inline auto"]
progress_category = "sdk"
[[lib.object]]
name = "ext/dolsdk2001/G2D/G2D.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc", "-i src/ext/dolsdk2001/gx"]
completed = true

# texPalette.o (texPalette.a) was dropped by the original link: not one of its
# eight functions is present in the retail image. Binary evidence:
#   * Compiling the reference source with the project flags (GC/1.2.5n, the
#     sibling dolsdk2001 settings used here) produces a 0x4CC-byte .text holding
#     TEXGetPalette (0xB4), LoadTexPalette (0x7C), UnpackTexPalette (0x12C),
#     TEXGet (0x10), TexFreeFunc (0x28), TEXReleasePalette (0x5C),
#     TEXGetGXTexObjFromPalette (0xD4) and TEXGetGXTexObjFromPaletteCI (0x108).
#     A masked full-body search over the whole DOL - only the operands of the 38
#     .rela.text entries (bl/REL24, ADDR16_HA, ADDR16_LO, SDA21) are wildcarded,
#     every other byte is compared - finds no match for any of the eight bodies.
#     The same search does find the already-integrated GXTexture.o members
#     (GXInitTexObjCI at 0x800BAC58, GXInitTlutObj at 0x800BB050) and vec.o's
#     PSVECAdd (0x800A3A78), so the method is not blind.
#   * UnpackTexPalette is not assert-only code: its OSPanic(__FILE__, 0x53,
#     "invalid version number for texture palette") always compiles, so the
#     member's .data would hold "texPalette.c" followed by "invalid version
#     number for texture palette" (0x3B bytes with the source's padding).
#     Neither string occurs anywhere in the 3,779,808-byte DOL (0 hits each).
#   * symbols.txt has no TEX*/Tex* function and the game's texture-object setup
#     is its own code: GXInitTexObjCI (0x800BAC58) has exactly two callers,
#     0x8016B790 and 0x801BC280, and both sit inside large game routines that
#     drive GXInitTlutObj/GXLoadTlut/GXInitTexObj/GXInitTexObjLOD/GXLoadTexObj
#     off their own texture structures (0x8016B714-0x8016B810), not off a
#     TEXPalettePtr/TEXDescriptorPtr pair.
#   * The member's only two external data references, DODisplayCache and
#     DOCacheInitialized, belong to fileCache.c, which is itself dead-stripped
#     (see the fileCache.a note), so a live texPalette.o would have had to drag
#     the fileCache/List/string cluster into the image; none of those bodies
#     exist.
# The member therefore contributes no bytes and takes the conventional
# zero-length slot at 0x800CF708 shared by the other dropped dolsdk2001 members.
# All eight definitions stay in the source, each marked with the single
# "// UNUSED:" line. The object needs no symbols.txt entry: every name it
# references (DODisplayCache, DOCacheInitialized, DSGetCacheObj,
# DSAddCacheNode, DSReleaseCacheObj, DVDOpen, DVDReadPrio, DVDClose,
# __OSCurrHeap, OSAllocFromHeap, OSFreeToHeap, OSPanic, GXInitTexObj,
# GXInitTexObjCI, GXInitTexObjLOD, GXInitTlutObj) is either defined by an
# already-linked unit or only reachable from the stripped bodies.
[[lib]]
name = "texPalette"
mw_version = "GC/1.2.5n"
cflags_preset = "base"
cflags_extra = ["-use_lmw_stmw on", "-common off", "-inline auto"]
progress_category = "sdk"
[[lib.object]]
name = "ext/dolsdk2001/texPalette/texPalette.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc"]
completed = true

# ax.a is the Dolphin AX audio library. Its AX.c member holds only the two
# library entry points AXInit/AXQuit, and the original link dropped them: not
# one of the twelve __AX*Init/__AX*Quit bodies they call exists anywhere in the
# retail image. Binary evidence:
#   * Compiling this source with the project flags (GC/1.2.5n, the sibling
#     dolsdk2001 settings used here, -DNDEBUG=1 so the #ifdef DEBUG OSReport
#     lines compile out) gives AXInit at .text+0x0 and AXQuit at +0x34, each
#     0x34 bytes: `mflr r0; stw r0,4(r1); stwu r1,-8(r1)`, six `bl` calls, then
#     `lwz r0,12(r1); addi r1,r1,8; mtlr r0; blr`.
#   * A masked full-body search over the whole 3,779,808-byte DOL - the operands
#     of the six REL24 `bl` words wildcarded, every other byte compared - finds
#     no match (0 hits), and neither does the looser variant with 3..7 calls
#     between the same prologue and epilogue. The method is not blind: the same
#     search with the ai.a source finds AIInit at 0x800AC440 (0x800AC464 in
#     symbols.txt, past the revision's OSRegisterVersion call) and
#     AIGetDSPSampleRate at 0x800AC2F0.
#   * The DOL's .text has no room for the member: dsp_task.c ends at
#     0x800AF280 and card/CARDBios.c starts at exactly 0x800AF280, the address
#     where an ax.a member linked between dsp.a and card.a would have sat.
#   * ax.a's distinctive data is missing too: the 3264-word axDspSlave image
#     (DSPCode.c) does not occur in the DOL, and the .data slot between
#     dsp_task.c (ends 0x80312668) and CARDBios.c (starts 0x803127A8) holds
#     nothing but dsp.c's debug strings, while ax.a would need 0x1980 bytes
#     there. The only DSP ucode in the image is at 0x8036a520, inside the game's
#     own data, and it differs from dolsdk2001's axDspSlave in 2054 of 3264
#     words: that is the game audio library's own AX-family ucode (snd/musyx,
#     e.g. sndStreamDeactivate at 0x80150564), not ax.a's.
#   * None of AXVPB.c's assert messages ("PB updates cannot exceed 5ms",
#     "*** loop address on ADPCM frame header! ***") occurs in the DOL, and
#     symbols.txt names no AX function.
# The member therefore contributes no bytes and takes the conventional
# zero-length slot at 0x800CF708 shared by the other dropped dolsdk2001 members.
# Both definitions stay in the source, each marked with the single "// UNUSED:"
# line. The object needs no symbols.txt entry: the twelve names it references
# (__AXAllocInit, __AXVPBInit, __AXSPBInit, __AXAuxInit, __AXClInit,
# __AXOutInit and the matching Quit functions) live in ax.a members that the
# original link never pulled in, so they are reachable only from the stripped
# bodies.
[[lib]]
name = "ax"
mw_version = "GC/1.2.5n"
cflags_preset = "base"
cflags_extra = ["-use_lmw_stmw on", "-common off", "-inline auto"]
progress_category = "sdk"
[[lib.object]]
name = "ext/dolsdk2001/ax/AX.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc", "-i src/ext/dolsdk2001/ax"]
completed = true

# AXAlloc.o (ax.a) was dropped by the original link too: not one of its fifteen
# functions occurs in the retail image. Binary evidence:
#   * Compiling this source with the project flags (GC/1.2.5n, the sibling
#     dolsdk2001 settings used here, -DNDEBUG=1 so the ASSERTLINE calls compile
#     out) produces 0x708 bytes of .text holding, in order, __AXGetStackHead
#     (0x18), __AXServiceCallbackStack (0x80), __AXInitVoiceStacks (0xB4),
#     __AXAllocInit (0xB4), __AXAllocQuit (0xB4), __AXPushFreeStack (0x14),
#     __AXPopFreeStack (0x24), __AXPushCallbackStack (0x10),
#     __AXPopCallbackStack (0x1C), __AXRemoveFromStack (0x94),
#     __AXPushStackHead (0x58), __AXPopStackFromBottom (0x70), AXFreeVoice
#     (0x78), AXAcquireVoice (0x174) and AXSetVoicePriority (0xA8).
#   * A masked full-body search over the whole 3,779,808-byte DOL - only the
#     operands of the object's 61 .rela.text entries (REL24 bl/call sites,
#     ADDR16_HA/LO pairs and EMB_SDA21 SDA offsets) are wildcarded, every other
#     byte is compared - finds no match (0 hits) for fourteen of the fifteen
#     bodies, and also no match for the 0x708-byte block as a whole, which a
#     live member would have to occupy contiguously. Dropping the ADDR16
#     wildcards and masking only the branch words still yields 0 hits. The
#     method is not blind: run over the already-integrated ai.a object it finds
#     that member's bodies at their real addresses (AIInitDMA at 0x800AC070,
#     AIStartDMA at 0x800AC0F8, AIStopDMA at 0x800AC110,
#     AISetDSPSampleRate at 0x800AC210, AIGetDSPSampleRate at 0x800AC2F0, ...).
#   * The one hit, __AXGetStackHead at 0x801A679C, is a false positive: it is the
#     tail of the unrelated game function zz_801A678C_ (0x801A678C-0x801A67BC),
#     preceded by `cmpwi r3,0 / blt` and `cmpwi r3,8 / bge` bounds checks and
#     indexing the game's own table at 0x804655E0. The SDK body is a bare
#     unchecked `__AXStackHead[priority]` accessor (lis; slwi r3,r3,2; addi;
#     add; lwz r3,0(r3); blr), so only that six-instruction shape coincides.
#   * The member carries no data fingerprint to look for: its only statics
#     (__AXStackHead[32], __AXStackTail[32], __AXCallbackStack) are
#     zero-initialized .bss/.sbss, it emits no .rodata, and the DOL contains no
#     "AXAlloc" text at all (0 hits, as expected for a -DNDEBUG build).
#   * AXAlloc.o can only have been pulled in by another ax.a member, and AX.c is
#     itself absent (see the ax.a note above), so nothing in the image could
#     reference these functions. There is also no room for the member: its
#     natural link position is between dsp.a and card.a, and dsp/dsp_task.c ends
#     at 0x800AF280 exactly where card/CARDBios.c starts.
#   * The game's audio stack is its own musyx/snd library, not AX: its voice
#     allocator, salActivateVoice (0x8015D44C), drives a 188-byte-stride voice
#     table at 0x80447E60 through byte state flags at offsets 0xEC-0xEF, not AX's
#     32-priority __AXStackHead/__AXStackTail stack lists, and symbols.txt names
#     no AX* function.
# The member therefore contributes no bytes and takes the conventional
# zero-length slot at 0x800CF708 shared by the other dropped dolsdk2001 members.
# All fifteen definitions stay in the source, each marked with the single
# "// UNUSED:" line. The object needs no symbols.txt entry: the three names it
# references (OSDisableInterrupts, OSRestoreInterrupts, __AXSetPBDefault) are
# either defined by an already-linked unit or only reachable from the stripped
# bodies.
[[lib.object]]
name = "ext/dolsdk2001/ax/AXAlloc.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc", "-i src/ext/dolsdk2001/ax"]
completed = true

# AXAux.o (ax.a) was dropped by the original link too: not one of its nine
# functions occurs in the retail image. Binary evidence:
#   * Compiling this source with the project flags (GC/1.2.5n, the sibling
#     dolsdk2001 settings used here, -DNDEBUG=1 so the #ifdef DEBUG OSReport
#     lines compile out) produces 0x304 bytes of .text holding, in order,
#     __AXAuxInit (0xDC), __AXAuxQuit (0x10), __AXGetAuxAInput (0x1C),
#     __AXGetAuxAOutput (0x1C), __AXGetAuxBInput (0x1C), __AXGetAuxBOutput
#     (0x1C), __AXProcessAux (0x190), AXRegisterAuxACallback (0xC) and
#     AXRegisterAuxBCallback (0xC), plus .bss 0x2D00 for the two 3x480-long
#     aux buffers and .sbss 0x2C for the eleven bookkeeping words.
#   * A masked full-body search over the whole 3,779,808-byte DOL - only the
#     operands of the object's 62 .rela.text entries (the REL24 calls to
#     DCInvalidateRange/DCFlushRangeNoSync, the ADDR16_HA/LO buffer pairs and
#     the EMB_SDA21 SDA offsets) are wildcarded, every other byte is compared
#     - finds no match (0 hits) for any of the nine bodies, and none for the
#     0x304-byte block as a whole, which a live member would have to occupy
#     contiguously. The method is not blind: run over the already-integrated
#     ai.a object it finds that member's bodies at their real addresses
#     (AIInitDMA at 0x800AC070, AIStartDMA at 0x800AC0F8, AISetDSPSampleRate at
#     0x800AC210, AIGetDSPSampleRate at 0x800AC2F0, AISetStreamPlayState at
#     0x800AC128, ...).
#   * The member is also absent by constant, independently of body layout and
#     compiler revision: all four __AXGetAux* getters index the buffers with
#     `mulli rX,rY,1920` (3 * 480 * sizeof(long)), and __AXProcessAux adds the
#     0x1680 offset between __AXBufferAuxA and __AXBufferAuxB. The DOL contains
#     no mulli with immediate 0x780 and no addi with immediate 0x1680 anywhere
#     (0 hits each), so not even an inlined or re-scheduled copy of the getters
#     survives in some other caller.
#   * The seven `li rX,0x780` words the DOL does contain are the musyx/snd
#     library's own 0x780-byte voice flushes, not AX aux buffers: they feed
#     memset over the 188-byte-stride voice table at 0x80447E60
#     (salActivateStudio, 0x8015A950) or DCFlushRangeNoSync over that table's
#     per-voice windows (zz_8015D678_, 0x8015D678-0x8015D7D0). Neither touches
#     a 3x480-long buffer pair at a 32-byte-aligned .bss address.
#   * The member carries no data fingerprint to look for: the two aux buffers
#     are zero-initialized .bss, the eleven statics are zero-initialized
#     .sbss, and no string is emitted at all in a -DNDEBUG build.
#   * AXAux.o can only have been pulled in by another ax.a member (AX.c's
#     __AXAuxInit/__AXAuxQuit) or by AXCl/AXOut's use of __AXProcessAux and the
#     getters, and AX.c is itself absent (see the ax.a note above). There is
#     also no room for the member: its natural link position is between dsp.a
#     (dsp/dsp_task.c ends at 0x800AF280) and card.a (card/CARDBios.c starts at
#     exactly 0x800AF280).
# The member therefore contributes no bytes and takes the conventional
# zero-length slot at 0x800CF708 shared by the other dropped dolsdk2001 members.
# All nine definitions stay in the source, each marked with the single
# "// UNUSED:" line. The object needs no symbols.txt entry: the three names it
# references (DCInvalidateRange, DCFlushRangeNoSync, __AXClMode) are either
# defined by an already-linked unit or only reachable from the stripped bodies.
[[lib.object]]
name = "ext/dolsdk2001/ax/AXAux.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc", "-i src/ext/dolsdk2001/ax"]
completed = true


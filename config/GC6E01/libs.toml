# reference text: the reference revision ships those helpers as plain static (and
# inpSetRPNHi/Lo/Dec/Inc as extern) definitions, which MWCC emits out-of-line in addition to
# inlining them (0x20B0 total, 0x3DC of duplicates the binary does not contain: measured by

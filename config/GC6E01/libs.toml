# InitTrackEvents 0x174, HandleTrackEvents 0x49C, seqHandle 0x9F4, seqInit 0x1A8.  It starts where
# the previous audio member's run ends and ends at 0x8014A23C, which is synth.c's synthSetBpm; all
# 16 bodies reproduce with zero differing words (sda21/ADDR16_HA/ADDR16_LO/REL24 operands resolved
# against symbols.txt and the runtime _SDA_BASE_ 0x80480820).
# Inlining: the file's 23 private helpers stay `static`, as in the reference.  -O4,p -inline auto
# (archive preset) emits 0x5104 bytes of text: the 16 entry points with the helper bodies inlined
# into them, plus one out-of-line copy of every helper (ClearNotes 0xD4, ResetNotes 0xD8,
# KillNotes 0x90, AllocateNote 0xF0, FreeNote 0x6C, HandleNotes 0x12C, KeyOffNotes 0xD0,
# seqFreeKeyOffNote 0x60, HandleKeyOffNotes 0x100, InitPublicIds 0xC, GetPublicId 0x98,
# DoPrgChange 0xD0, BuildTransTab 0x9C, SetTickDelta 0xE0, HandleMasterTrack 0xE8,
# RewindMTrack 0x1D8, GetStreamValue 0x8C, InitStream 0xD0, HandleStream 0xE4,
# InsertGlobalEvent 0x74, GetNextEventTime 0x1C, GetGlobalEvent 0x30, InitTrackEventsSection
# 0x194 = 0x1138) and the two seqKill* exports (seqKillAllInstances 0x5C,
# seqKillInstancesByGroupID 0x90 = 0xEC).  No live code references those 25 bodies - the helpers
# have no remaining caller and seqKill* are only reached from snd_synthapi.c's never-called
# sndFXCtrl14/sndFXSilence - so Metrowerks' unreferenced-function elimination drops them and lays
# the 16 entry points out as the retail 0x3EE0 run; the linked ELF carries exactly those 16
# symbols at 0x8014635C-0x8014A23C and the DOL matches bit for bit.  Nothing present in the target
# was deleted to obtain this, and the dead seqKill* definitions are kept in the source.
# Float: SetTickDelta stores (u16)floorf(tickDelta) and the retail sequence is `bl floor`, `frsp
# f0,f1`, `fctiwz f0,f0` - a single-precision wrapper over floor() that is inlined, not a call to a
# library floorf.  This tree's MSL math.h is the C89 subset plus single-precision wrappers
# (powf/fmodf), so floorf is provided there the same way (static inline in msl/math.h); without it
# the member references an undefined `floorf` and the inlined SetTickDelta copies in
# HandleTrackEvents and seqHandle come out 4 and 8 instructions (0x50 bytes) short.
# Version: the binary pins MUSY_VERSION to 1.5.4 <= v < 2.0.0 for this member.  HandleEvent's
# GetStreamValue inlines take the 1.5.4+ `extsh/rlwinm/or/sth` shape at 0x80148700, and with
# MUSY_VERSION_PATCH=3 the same source leaves 62 differing instructions in HandleEvent (the 1.5.2
# variant reads the stream value as a single halfword).  Every live version boundary of the 16
# bodies is identical from 1.5.4 through 2.0.0, so the reference text compiles unchanged in that
# window; the game's runtime is v1.5.4 (as synth.c/synthvoice.c/snd_synthapi.c), so PATCH=4 is used.
# Data: .data 0x80368A30-0x80368A80 (0x50) is HandleEvent's 20-entry event jump table, emitted as

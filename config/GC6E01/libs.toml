# stub.c is dolsdk2001's dummy link-satisfier TU: one-line bodies for 71 symbols
# that the SDK archives expect some other object to provide. The retail DOL never
# links it, so this object is registered as never-linked (completed = false); it
# has no split range in config/GC6E01/splits.txt and dtk emits no compile or link
# edge for it.
# Binary evidence (powerpc-eabi-nm on a GC/1.2.5n build of stub.c and on
# build/GC6E01/main.elf, objects listed by the build.ninja link rule):
#   * the compiled object holds 71 definitions, .text = 0x11C bytes, all `blr`;
#   * 43 of the 71 names are already defined by objects in the link: memcpy,
#     memset and __init_registers in the .init slices, main at 0x800055E0, and
#     the __div2i, __mod2i, __cvt_fp2unsigned, str/mem/printf families,
#     DSPAddTask, the MetroTRK entries and the _savefpr/_restfpr helpers in the
#     .text slice at 0x800A2B9C;
#   * 8 more are provided without any object text: _stack_addr, _stack_end,
#     __ArenaLo and __ArenaHi by build/GC6E01/ldscript.lcf, and _rom_copy_info,
#     _bss_init_info, _ctors and _dtors by the DOL's own .init/.ctors/.dtors
#     tables;
#   * the remaining 20 are not in the DOL at all: DSPAssertTask, DSPCheckInit,
#     DSPCheckMailToDSP, DSPGetDMAStatus, DSPHalt, DSPInit, DSPReset,
#     DSPSendMailToDSP, __shl2i, __shr2i, __shr2u, _start, cosf, powf, sinf,
#     tanf, rand, srand, tolower and vsprintf.
# Linking this object would therefore be a 51-way duplicate-definition error plus
# 0x11C bytes of stub text the DOL does not contain. The source is kept at the
# dolsdk2001 revision and every definition carries an "// UNUSED:" mark.
[[lib]]
name = "stub"
mw_version = "GC/1.2.5n"
cflags_preset = "base"
cflags_extra = ["-use_lmw_stmw on", "-common off", "-inline auto"]
progress_category = "sdk"
[[lib.object]]
name = "ext/dolsdk2001/stub.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc"]
completed = false

# amcstubs.a is dolsdk2001's stub implementation of the AMC/EXI2 debugger
# interface. The retail DOL links the whole AmcExi2Stubs.o object because the
# MetroTRK code calls into it, so all eight bodies are present in the binary, in
# source declaration order, at .text 0x800CE79C..0x800CE7CC:
#   0x800CE79C blr              EXI2_Init            (empty body)
#   0x800CE7A0 blr              EXI2_EnableInterrupts(empty body)
#   0x800CE7A4 li r3,0; blr     EXI2_Poll            (return 0)
#   0x800CE7AC li r3,0; blr     EXI2_ReadN           (return AMC_EXI_NO_ERROR)
#   0x800CE7B4 li r3,0; blr     EXI2_WriteN          (return AMC_EXI_NO_ERROR)
#   0x800CE7BC blr              EXI2_Reserve         (empty body)
#   0x800CE7C0 blr              EXI2_Unreserve       (empty body)
#   0x800CE7C4 li r3,1; blr     AMC_IsStub           (return 1)
# The callers are the MetroTRK slices (e.g. bl at 0x800C3EF8 EXI2_Init,
# 0x800C3C0C EXI2_EnableInterrupts, 0x800C3C34 EXI2_Poll, 0x800C3C50 EXI2_ReadN,
# 0x800C3D60 EXI2_WriteN, 0x800C3CA0 EXI2_Reserve, 0x800C3CC4 EXI2_Unreserve,
# 0x800C3864 AMC_IsStub), which is why the archive member was pulled in whole.
# Flags follow the dolsdk2001 release recipe (-O4,p -inline auto, char unsigned
# by default); the bodies contain no prologue or char access, so the
# -use_lmw_stmw/-common settings are inert here and are kept consistent with the
# os entries of the same SDK release.
[[lib]]
name = "amcstubs"
mw_version = "GC/2.6"
cflags_preset = "base"
cflags_extra = ["-use_lmw_stmw on", "-common off", "-inline auto"]
progress_category = "sdk"
[[lib.object]]
name = "ext/dolsdk2001/amcstubs/AmcExi2Stubs.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/include/libc"]
completed = true

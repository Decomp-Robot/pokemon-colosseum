# shows the linker stripped that function. .sdata 0x80478A78-0x80478AB8
# holds GXTexMode0Ids..GXTexTlutIds (8 bytes each) plus the static
# GX2HWFiltConv table (6 bytes; HW2GXFiltConv follows it in the object but is

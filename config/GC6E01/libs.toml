# Compiler: GC/2.6 (the runtime archive default) reproduces all three bodies,
# including the retail prologues (stwu r1,-16(r1); stw r31,12(r1) in
# UpdateSettings, plain -16 frame in Prepare and in the HI handler) and the
# `li r0` flag stores; -common off is kept for parity with the sibling member
# and -fp_contract off keeps the six independent lfs loads (no fused ops are

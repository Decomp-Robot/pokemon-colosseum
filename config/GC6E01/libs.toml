# delay.o (axfx.a) was dropped by the original link, like chorus.o before it:
# not one of its four functions occurs in the retail image. Binary evidence:
#   * The member is code-only: its GC/1.2.5n object has exactly one content
#     section beyond .comment - .text (0x490 bytes) - and no .data/.bss/
#     .sdata/.rodata at all, so there is no data footprint to search for.
#   * A masked full-body search over the whole DOL - only the operands of the
#     object's .rela.text entries (REL24 branch words and the EMB_SDA21
#     __OSCurrHeap rA nibble + 16-bit offset) wildcarded, every other byte
#     compared - finds no match for any of the four bodies: AXFXDelayCallback
#     (0x1d0 bytes, zero relocations, so a pure exact-byte search),
#     AXFXDelaySettings (0x1f8), AXFXDelayInit (0x48) and AXFXDelayShutdown
#     (0x80) when built with GC/1.2.5n. The same search is empty with GC/2.6
#     (0x408 bytes of .text) and GC/3.0a5 (0x3f4) builds, so the result is not
#     an artifact of the compiler revision chosen here. The search method was
#     validated with positive controls compiled the same way: OSAllocFromHeap,
#     OSFreeToHeap and OSCreateHeap bodies each match their symbols.txt
#     addresses exactly (0x8009A9D8 / 0x8009AAD4 / 0x8009ABD0).
#   * Nothing could pull the member in: symbols.txt names no AXFX symbol, no
#     AXFX-family data or strings are in the image, and the game's audio
#     library is MusyX (snd), not AX/AXFX - as established for chorus.o.
#     AXFXDelayInit references AXFXDelaySettings, but nothing anywhere
#     references AXFXDelayInit, so the whole group dead-strips.
# The object therefore contributes no bytes and takes the conventional
# zero-length slot at 0x800CF708 shared by the other dropped dolsdk2001
# members. All four definitions stay in the source as shipped by the SDK,
# each marked with the single "// UNUSED:" line; the object needs no
# symbols.txt entry because nothing references AXFXDelayCallback, so the
# linker strips it (and, with it, the other three bodies) again.
[[lib.object]]
name = "ext/dolsdk2001/axfx/delay.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc"]
completed = true

# The retail reverb engine at .text 0x80164520-0x801653BC is the runtime.a member
# ext/musyx_sdk/runtime/StdReverb/reverb.c (see its entry in the runtime lib
# block), not this axfx.a object.  The image's engine takes its delay lines from
# the snd library's settable allocator hooks (installed at 0x801631AC into
# lbl_8047B054/lbl_8047B058) through the trampolines salAlloc 0x801643D8 /
# salFree 0x80164400 (runtime.a hw_memory.c), and its three exported entry
# points are called from the sibling StdReverb/reverb_fx.c AUX callbacks at
# 0x8016442C/0x80164488/0x801644E0; axfx/reverb_hi.c allocates with
# OSAllocFromHeap(__OSCurrHeap, ...) and keeps every definition file-static, so
# it cannot provide those symbols.  This object therefore keeps the pristine
# dolsdk2001 text and contributes no bytes: splits.txt gives it the same
# zero-length dropped-member slot as chorus.c/delay.c/reverb_std.c.
[[lib.object]]
name = "ext/dolsdk2001/axfx/reverb_hi.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc"]
completed = true

# reverb_std.o (axfx.a) was dropped by the original link, like chorus.o and
# delay.o before it: none of its 12 functions occurs in the retail image.
# Binary evidence:
#   * Its distinctive .data fingerprint - ReverbSTDCreate's static const
#     lens[4] = {0x06FD, 0x07CF, 0x01B1, 0x0095} (16 bytes) - does not occur
#     anywhere in the DOL. The search was validated with the linked
#     reverb_hi.o as positive control: its static lens[8] sits at .data
#     0x8036BF00 (06FD 07CF 091D 01B1 0095 002F 0049 0043) exactly as
#     splits.txt records, i.e. a linked axfx member's initialized data is
#     always present in the image and is found by this search.
#   * The .sdata2 constants in reverb_std.c's declaration order (value0_3
#     0.3f then value0_6 0.6f, adjacent) do not occur; the only adjacency in
#     the image is reverb_hi.o's reverse order at 0x8047D530, and the asm
#     HandleReverb prologue of reverb_std.c (stwu r1,-144(r1) = 9421FF70,
#     stmw r17,8(r1) = BC240008) does not occur anywhere in .text. The only
#     HandleReverb in the image is reverb_hi.c's at 0x80164DD0
#     (9421FF40 BDC10008), covered by the reverb_hi object above.
#   * Link order rules out a hidden slice: axfx.a members link in archive
#     order (chorus.o, delay.o, reverb_hi.o, reverb_std.o); reverb_hi.o ends
#     exactly at .text 0x801653BC where the game's own code
#     (auto_01_801653BC_text.s) begins, so reverb_std.o cannot follow it.
#   * Nothing could pull the member in: the game's snd library registers one
#     reverb AUX callback (sndAuxCallbackReverbHI, 0x8016442C) and its body
#     calls ReverbHICallback directly (bl at 0x80164474) - the game routes
#     its "STD" reverb request to the HI engine. symbols.txt names no
#     AXFXReverbStd* symbol, and the four exported functions
#     (AXFXReverbStdInit/Shutdown/Settings/Callback) are referenced by
#     nothing, so the whole member (every internal references only its own
#     file) dead-strips.
# The object therefore contributes no bytes and takes the conventional
# zero-length slot at 0x800CF708 shared by the other dropped dolsdk2001
# members. All 12 definitions stay in the source as shipped by the SDK
# (byte-identical to the pristine .sdk-cache copy apart from the 12
# "// UNUSED:" lines), each marked with the single "// UNUSED:" line; no
# symbols.txt entries are added because nothing references
# AXFXReverbStdCallback, so the linker strips the member again.
[[lib.object]]
name = "ext/dolsdk2001/axfx/reverb_std.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc"]
completed = true

# syn.a is the Dolphin synth library that layers MIDI note handling on top of
# ax.a + mix.a. Its core member syn.c holds the library entry points
# (SYNInit/SYNQuit), the per-frame driver SYNRunAudioFrame, the synth
# lifecycle (SYNInitSynth/SYNQuitSynth), MIDI buffering (SYNMidiInput), the
# master-volume/note queries and the two static list helpers. The original
# link dropped the whole member. Binary evidence:
#   * Compiling the pristine source with the sibling audio-library flags
#     (GC/1.2.5n, the ai.a/ax.a settings, -DNDEBUG=1 so the ASSERTLINE /
#     ASSERTMSGLINE lines compile out) gives 11 bodies totalling 0x730 bytes
#     of .text, from __SYNAddSynthToList (0x50 bytes) to SYNGetActiveNotes
#     (8 bytes: lwz/blr).
#   * A masked full-body search over the whole 3,779,808-byte DOL - the
#     operands of every REL24 `bl` word and every .rela.text relocation
#     wildcarded, every other byte compared - finds no match for any of the
#     11 bodies (0 hits), and the search stays empty when the source is
#     rebuilt with GC/2.6 (the project's linker version), so the result is
#     not an artifact of the compiler revision chosen here. The method is
#     not blind: the same search with the same script finds the linked ai.a
#     member AIInitDMA at exactly its symbols.txt address 0x800AC070
#     (pristine ai.c, GC/1.2.5n, identical flags).
#   * syn.a's distinctive initialized data is missing too. Its members carry
#     non-BSS .data tables - synctrl.o 0x21c bytes, synmix.o 0x390,
#     synpitch.o 0x3f0, synlfo.o 0x100 in the same build - and none of these
#     byte arrays occurs anywhere in the DOL, neither full-length nor as
#     their first 64 bytes. syn.c itself holds only the .sbss pointer
#     __SYNSynthList, which leaves no footprint.
#   * The member's one assert message, SYNMidiInput's "synth input buffer
#     exceeded, increase SYN_INPUT_BUFFER_SIZE", does not occur in the image,
#     and a full strings scan finds no SYN-family string at all.
#   * Nothing could pull the member in: symbols.txt names no SYN* or MIX*
#     symbol, and the bodies reference mix.a's MIXReleaseChannel and ax.a's
#     AXFreeVoice - members the original link never took (see the ax.a note;
#     the game's audio is its own MusyX-family snd library) - plus sibling
#     syn.a members (__SYNServiceVoice, __SYNRunInputBufferEvents,
#     __SYNResetAllControllers, __SYNVoice) that are equally absent. With no
#     reference to any SYN* export the whole member dead-strips.
# The member therefore contributes no bytes and takes the conventional
# zero-length slot at 0x800CF708 shared by the other dropped dolsdk2001
# members. All 11 definitions stay in the source as shipped by the SDK
# (byte-identical to the pristine .sdk-cache copy apart from the 11
# "// UNUSED:" lines), each marked with the single "// UNUSED:" line; no
# symbols.txt entries are added because nothing references the SYN exports,
# so the linker strips the member again.
[[lib]]
name = "syn"
mw_version = "GC/1.2.5n"
cflags_preset = "base"
cflags_extra = ["-use_lmw_stmw on", "-common off", "-inline auto"]
progress_category = "sdk"
[[lib.object]]
name = "ext/dolsdk2001/syn/syn.c"
extra_cflags = ["-i src/ext/dolsdk2001/include", "-i src/ext/dolsdk2001/os", "-i src/ext/dolsdk2001/include/libc", "-i src/ext/dolsdk2001/syn"]
completed = true

